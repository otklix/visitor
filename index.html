<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maskotamail</title>
<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --text:#000000;
  --muted:#666666;
  --border:#000000;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:var(--bg);color:var(--text);
  font-family:system-ui,sans-serif;padding:16px;
}
.card{
  width:min(680px,100%);background:var(--card);
  border:2px solid var(--border);padding:24px;
  display:flex;flex-direction:column;gap:14px;
}
h1{margin:0;font-size:22px;letter-spacing:2px;text-transform:uppercase}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input{
  padding:12px 14px;border:2px solid var(--border);
  background:#fff;color:#000;font-size:15px;outline:none;
}
input:focus{border-color:#000;box-shadow:0 0 0 2px #000}
button{
  padding:12px 16px;border:2px solid var(--border);
  background:#000;color:#fff;font-size:15px;font-weight:600;cursor:pointer;
  text-transform:uppercase;letter-spacing:1px;
}
button:hover{background:#fff;color:#000}
.status{color:var(--muted);font-size:14px;margin:0;min-height:20px}
.list{
  list-style:none;padding:0;margin:0;display:flex;flex-direction:column;
  gap:10px;max-height:60vh;overflow:auto;
}
.item{
  background:#fff;border:2px solid var(--border);padding:12px 14px;
}
.item .subj{font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.item .from{color:var(--muted);font-size:13px}
.item .body{color:#000;font-size:14px;white-space:pre-wrap;margin-top:8px}

/* ---- КОТ ---- */
.cat{display:flex;justify-content:center;filter:grayscale(100%) contrast(150%)}
.cat svg{width:180px;height:180px;overflow:visible}

/* хвост качается всегда */
.cat .tail{
  transform-origin:120px 120px;
  animation:tail-wag 2.4s ease-in-out infinite;
}
@keyframes tail-wag{
  0%,100%{transform:rotate(-6deg)}
  50%{transform:rotate(8deg)}
}

/* лапки внизу, поднимаются к глазам */
.cat .paws{transform:translateY(14px);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.cat.is-hiding .paws{transform:translateY(-42px) scale(1.05)}

/* уши прижимаются */
.cat .ear{transition:transform .28s ease;transform-origin:80px 50px}
.cat.is-hiding .ear-l{transform:rotate(-10deg) translateY(3px)}
.cat.is-hiding .ear-r{transform:rotate(10deg) translateY(3px)}

/* глаза: открытые / закрытые */
.cat .eyes-open{transition:opacity .15s ease}
.cat .eyes-closed{opacity:0;transition:opacity .15s ease}
.cat.is-hiding .eyes-open{opacity:0}
.cat.is-hiding .eyes-closed{opacity:1}

/* лёгкое покачивание, когда прячется */
.cat.is-hiding svg{animation:peek-bob 1.6s ease-in-out infinite}
@keyframes peek-bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}

/* уважение к reduce motion */
@media (prefers-reduced-motion: reduce){
  .cat *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="card">
  <div id="cat" class="cat" role="img" aria-label="Кот смотрит на вас"></div>
  <h1>maskotamail</h1>
  <label>Ключ шифрования
    <input id="key" type="password" placeholder="FERNET_KEY" autocomplete="off">
  </label>
  <button id="load">Показать письма</button>
  <p id="status" class="status"></p>
  <ul id="list" class="list"></ul>
</main>
<script>
/* ---------- КОТ ---------- */
const CAT = `
<svg viewBox="0 0 160 160">
  <!-- хвост -->
  <path class="tail" d="M120 120 Q150 110 145 85 Q142 70 130 72"
        fill="none" stroke="#8a5a2b" stroke-width="10" stroke-linecap="round"/>

  <!-- тело -->
  <ellipse cx="80" cy="120" rx="46" ry="34" fill="#c98a4b"/>
  <ellipse cx="80" cy="124" rx="30" ry="22" fill="#f3d2a6"/>

  <!-- уши -->
  <path class="ear ear-l" d="M44 60 L36 28 L66 44 Z"
        fill="#c98a4b" stroke="#8a5a2b" stroke-width="3" stroke-linejoin="round"/>
  <path class="ear ear-r" d="M116 60 L124 28 L94 44 Z"
        fill="#c98a4b" stroke="#8a5a2b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M44 54 L40 36 L58 46 Z" fill="#f3a6a6"/>
  <path d="M116 54 L120 36 L102 46 Z" fill="#f3a6a6"/>

  <!-- голова -->
  <circle cx="80" cy="66" r="38" fill="#c98a4b" stroke="#8a5a2b" stroke-width="3"/>

  <!-- румянец (растёт от длины ключа) -->
  <circle id="blush-l" cx="56" cy="78" r="9" fill="#f78d8d" opacity=".35"/>
  <circle id="blush-r" cx="104" cy="78" r="9" fill="#f78d8d" opacity=".35"/>

  <!-- глаза открытые -->
  <g class="eyes-open">
    <circle cx="64" cy="64" r="7" fill="#3b2a1a"/>
    <circle cx="96" cy="64" r="7" fill="#3b2a1a"/>
    <circle cx="66.5" cy="61.5" r="2.2" fill="#fff"/>
    <circle cx="98.5" cy="61.5" r="2.2" fill="#fff"/>
  </g>

  <!-- глаза зажмуренные -->
  <g class="eyes-closed">
    <path d="M56 64 Q64 56 72 64" stroke="#3b2a1a" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M88 64 Q96 56 104 64" stroke="#3b2a1a" stroke-width="4"
          fill="none" stroke-linecap="round"/>
  </g>

  <!-- нос и рот -->
  <path d="M76 76 L84 76 L80 81 Z" fill="#f08a8a"/>
  <path d="M80 81 Q74 88 68 84" stroke="#3b2a1a" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>
  <path d="M80 81 Q86 88 92 84" stroke="#3b2a1a" stroke-width="2.5"
        fill="none" stroke-linecap="round"/>

  <!-- усы -->
  <g stroke="#3b2a1a" stroke-width="2" stroke-linecap="round">
    <line x1="52" y1="80" x2="34" y2="76"/>
    <line x1="52" y1="86" x2="34" y2="88"/>
    <line x1="108" y1="80" x2="126" y2="76"/>
    <line x1="108" y1="86" x2="126" y2="88"/>
  </g>

  <!-- лапки, поднимаются к глазам -->
  <g class="paws">
    <ellipse cx="52" cy="112" rx="16" ry="12" fill="#c98a4b" stroke="#8a5a2b" stroke-width="3"/>
    <ellipse cx="108" cy="112" rx="16" ry="12" fill="#c98a4b" stroke="#8a5a2b" stroke-width="3"/>
  </g>
</svg>`;

const catEl = document.getElementById("cat");
catEl.innerHTML = CAT;

const keyInput = document.getElementById("key");
const loadBtn = document.getElementById("load");
const statusEl = document.getElementById("status");
const listEl = document.getElementById("list");

/* кот зажмуривается при фокусе на ключе */
keyInput.addEventListener("focus", () => {
  catEl.classList.add("is-hiding");
  catEl.setAttribute("aria-label", "Кот зажмурился и закрыл глаза лапками");
});
keyInput.addEventListener("blur", () => {
  catEl.classList.remove("is-hiding");
  catEl.setAttribute("aria-label", "Кот смотрит на вас");
});

/* румянец от длины ключа */
keyInput.addEventListener("input", () => {
  const t = Math.min(keyInput.value.length / 40, 1);
  const op = (0.35 + t * 0.55).toFixed(2);
  const bl = catEl.querySelector("#blush-l");
  const br = catEl.querySelector("#blush-r");
  if (bl) bl.setAttribute("opacity", op);
  if (br) br.setAttribute("opacity", op);
});

/* ---------- РАСШИФРОВКА ---------- */
function b64u(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  const p = s.length % 4 ? 4 - (s.length % 4) : 0;
  const bin = atob(s + "=".repeat(p));
  const o = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
  return o;
}
async function decryptFernet(tokenB64, keyB64){
  const t = b64u(tokenB64), k = b64u(keyB64);
  const sk = k.slice(0,16), ek = k.slice(16,32);
  const hk = await crypto.subtle.importKey("raw", sk,
    {name:"HMAC",hash:"SHA-256"}, false, ["verify"]);
  const ok = await crypto.subtle.verify("HMAC", hk,
    t.slice(-32), t.slice(0, t.length-32));
  if (!ok) throw new Error("Неверный ключ");
  const iv = t.slice(9,25), ct = t.slice(25, t.length-32);
  const ak = await crypto.subtle.importKey("raw", ek,
    {name:"AES-CBC"}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-CBC", iv}, ak, ct);
  return new TextDecoder().decode(plain);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ---------- ПОКАЗ ПИСЕМ + АВТООБНОВЛЕНИЕ ---------- */
let timer = null;

async function render(key){
  const res = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
  const data = await res.json();
  listEl.innerHTML = "";
  statusEl.textContent =
    `Писем: ${data.messages.length} • обновлено ${new Date().toLocaleTimeString()}`;
  for (const m of data.messages.slice().reverse()){
    const p = JSON.parse(await decryptFernet(m.enc, key));
    const li = document.createElement("li");
    li.className = "item";
    li.innerHTML = `
      <div class="subj">${esc(p.subject)}</div>
      <div class="from">${esc(p.from)} • ${esc(p.date)}</div>
      <div class="body">${esc(p.body).slice(0, 800)}</div>`;
    listEl.appendChild(li);
  }
}

loadBtn.addEventListener("click", async () => {
  const key = keyInput.value.trim();
  if (!key){ statusEl.textContent = "Введите ключ."; return; }
  statusEl.textContent = "Загружаю…";
  try {
    await render(key);
    if (timer) clearInterval(timer);
    timer = setInterval(() => render(key).catch(()=>{}), 5 * 60 * 1000);
  } catch (e){
    statusEl.textContent = "Ошибка: " + e.message;
  }
});
</script>
</body>
</html>l
